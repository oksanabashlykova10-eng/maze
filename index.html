<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Trap Editor</title><style>html,body{margin:0;height:100%;background:#050609;color:#fff;font-family:Arial,sans-serif}#boot{height:100%;display:grid;place-items:center}</style></head><body><div id="boot">Loading Maze Trap Editor…</div><script>(()=>{const block=e=>{e.preventDefault();e.stopPropagation();return false};window.addEventListener('contextmenu',block,true);window.addEventListener('keydown',e=>{const k=String(e.key||'').toLowerCase(),m=e.ctrlKey||e.metaKey;if(e.key==='F12'||(m&&e.shiftKey&&(k==='i'||k==='j'||k==='c'))||(m&&k==='u'))block(e)},true)})();(async()=>{const n=12;const files=Array.from({length:n},(_,i)=>`maze-data-${String(i+1).padStart(2,'0')}.txt`);const parts=[];for(const f of files){const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+': '+r.status);parts.push((await r.text()).trim())}const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('DecompressionStream unsupported');const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<div style="padding:24px">Не удалось загрузить Maze Trap Editor. Обновите браузер.</div>'});</script></body></html>
